<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<title>Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a back-room page, same look as the gallery but looser
   IDEA a list pinned up behind the workbench
   PICTURE the list itself
   COLOUR same white wall and near-black ink as the main site
   TYPE Schibsted Grotesk
   LAYOUT one readable column; status sits to the right of each idea, stacks on a phone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#151515,#ececec);--muted:light-dark(#6e6e6e,#9b9b9b);--line:light-dark(#e4e4e2,#2a2a2a);--mat:light-dark(#f2f1ee,#1c1c1c);--focus:light-dark(#1d4ed8,#8ab4ff)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
header{padding-block:clamp(48px,8vw,104px) clamp(24px,4vw,40px)}
h1{margin:0;font-weight:600;font-size:clamp(2.5rem,6vw,4.25rem);line-height:1.02;letter-spacing:-.035em}
header p{margin:.9rem 0 0;max-width:46ch;color:var(--muted);font-size:1.0625rem}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem 2rem;padding:1.1rem 0;border-bottom:1px solid var(--line)}
li h2{margin:0;font-size:1.0625rem;font-weight:500;line-height:1.35}
li .medium{color:var(--muted);font-size:.875rem;margin-top:.1rem}
li .note{grid-column:1;margin:.4rem 0 0;max-width:60ch}
li .status{grid-column:2;grid-row:1;font-size:.875rem;white-space:nowrap;padding-top:.15rem}
li .status[data-s="doing"]{font-weight:600}
li .status[data-s="done"]{color:var(--muted)}
.empty{padding:2.5rem 0;color:var(--muted);border-bottom:1px solid var(--line)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem 2rem;padding-block:1.5rem 3rem;color:var(--muted);font-size:.875rem}
@media(max-width:520px){li{grid-template-columns:minmax(0,1fr)}li .status{grid-column:1;grid-row:auto;padding-top:.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ideas</h1>
    <p>Oh, you found this. Fancy that. These are things I want to make at some point, in no particular order. Timelines are TBD.</p>
  </header>

  <ol id="list"></ol>

  <footer>
    <a href="./">Back to things I’ve actually made</a>
    <span id="count"></span>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   EDIT THIS LIST. Newest thoughts can go anywhere; it shows in this order.

   title:  the idea
   medium: optional, e.g. "Glass", "Woodworking"
   note:   optional, a sentence about it
   status: "someday" | "next" | "doing" | "done"
   made:   optional, for status "done": the #link of the finished piece
           on the main page, e.g. "#carousel"
   ------------------------------------------------------------------ */
const IDEAS = [
  { title: "Crocheted sweater", medium: "Textiles", status: "doing" },
  { title: "Sewn dress", medium: "Textiles", status: "doing" },
  { title: "Bigger carousel, with a motor", medium: "Laser cutting", status: "someday" },
  { title: "Stained glass lamp", medium: "Glass", status: "someday" }
];

/* ------------------------------------------------------------------ */
{
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LABEL = { someday: "Someday", next: "Next up", doing: "In progress", done: "Made it" };
const list = document.getElementById("list");

if (!IDEAS.length) {
  list.outerHTML = '<p class="empty">Nothing written down yet. Check back.</p>';
} else {
  list.innerHTML = IDEAS.map((i) => {
    const s = LABEL[i.status] ? i.status : "someday";
    const status = s === "done" && i.made
      ? `<a class="status" data-s="done" href="./${esc(i.made)}">${LABEL.done}</a>`
      : `<span class="status" data-s="${s}">${LABEL[s]}</span>`;
    return `<li>
      <div><h2>${esc(i.title)}</h2>${i.medium ? `<div class="medium">${esc(i.medium)}</div>` : ""}</div>
      ${status}
      ${i.note ? `<p class="note">${esc(i.note)}</p>` : ""}
    </li>`;
  }).join("");
}
const n = IDEAS.filter((i) => i.status !== "done").length;
document.getElementById("count").textContent = IDEAS.length ? `${n} still to make` : "";
}
</script>
</body>
</html>
