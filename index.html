<style>
/* VOICE everyday: a maker's portfolio, quiet so the work leads

   PICTURE the work itself, as a grid of equal tiles filling the first screen
   COLOUR white wall, near-black ink, warm grey mat behind each photo; charcoal at night
   TYPE Schibsted Grotesk for everything, weight does the work
   LAYOUT title left with the collection's figures on the right, filters under a rule, then the grid; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#151515,#ececec);--muted:light-dark(#6e6e6e,#9b9b9b);--line:light-dark(#e4e4e2,#2a2a2a);--mat:light-dark(#f2f1ee,#1c1c1c);--focus:light-dark(#1d4ed8,#8ab4ff);--font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:clip}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}

header.site{padding-block:clamp(48px,8vw,104px) clamp(28px,4vw,48px)}

header.site p{margin:.9rem 0 0;max-width:46ch;color:var(--muted);font-size:1.0625rem}

.filters{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;border-top:1px solid var(--ink);padding-block:.9rem 2.25rem}
.filters button{background:none;border:0;padding:.35rem 0;cursor:pointer;color:var(--muted);font-size:.9375rem;border-bottom:1.5px solid transparent}
.filters button span{font-size:.8125rem;margin-left:.3rem;font-variant-numeric:tabular-nums}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:2.25rem 1.25rem;padding-bottom:6rem}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.75rem .75rem}}
.tile{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.tile[hidden]{display:none}
.tile .art{display:block;aspect-ratio:4/5;background:var(--mat);overflow:hidden}
.tile .art img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease,opacity .3s}
.tile:hover .art img{transform:scale(1.03)}
.tile .title{display:block;margin-top:.7rem;font-weight:500;font-size:.96875rem;line-height:1.3}
.tile .sub{display:block;margin-top:.15rem;color:var(--muted);font-size:.875rem}
.tile .more{color:var(--muted);font-size:.8125rem;margin-left:.35rem;font-weight:400}

footer.site{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem;border-top:1px solid var(--line);padding-block:1.5rem 3rem;color:var(--muted);font-size:.875rem}

dialog{width:min(1240px,calc(100vw - 2rem));height:min(880px,calc(100dvh - 2rem));max-width:none;max-height:none;padding:0;border:0;background:var(--bg);color:var(--ink);overflow:hidden;opacity:0;transition:opacity .2s ease}
dialog[open]{opacity:1}
dialog::backdrop{background:rgba(8,8,8,.72)}
@starting-style{dialog[open]{opacity:0}}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.stage{display:flex;flex-direction:column;background:var(--mat);min-height:0}
.d-main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);min-height:0}

.d-thumbs{display:flex;gap:.5rem;padding:0 1rem 1rem;justify-content:center;overflow-x:auto}
.d-thumbs:empty{display:none}
.d-thumbs button{flex:0 0 auto;padding:0;cursor:pointer;background:none;border:0;opacity:.55;outline-offset:2px}

.panel{display:flex;flex-direction:column;padding:1.25rem 1.75rem 1.5rem;overflow-y:auto;border-left:1px solid var(--line)}

.icon-btn{background:none;border:1px solid var(--line);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}

{
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slugify = (s) => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "project";

const LIST = (() => {
  const seen = new Set();
  return PROJECTS
    .map((p, order) => ({ ...p, order }))
    .sort((a, b) => (b.year || 0) - (a.year || 0) || a.order - b.order)
    .map((p) => {
      let base = slugify(p.slug || p.title), slug = base, n = 2;
      while (seen.has(slug)) slug = `${base}-${n++}`;
      seen.add(slug);
      const images = (p.images || []).map((x) => typeof x === "string" ? { src: x, alt: p.title } : { alt: p.title, ...x });
      return { ...p, slug, media: p.media || [], images };
    });
})();

const GRID_SIZES = "(max-width: 560px) 50vw, (max-width: 1100px) 33vw, 320px";
const smallOf = (src) => src.replace(/(\.jpe?g)$/i, "-sm$1");
function imgTag(im, { lazy = true, small = false, sizes = GRID_SIZES } = {}) {
  const full = esc(im.src), sm = esc(smallOf(im.src));
  const src = small && sm !== full
    ? ` src="${sm}" srcset="${sm} 900w, ${full} 2000w" sizes="${sizes}" data-full="${full}" onerror="this.onerror=null;this.removeAttribute('srcset');this.src=this.dataset.full"`
    : ` src="${full}"`;
  const pos = im.pos ? ` style="object-position:${esc(im.pos)}"` : "";
  return `<img${src} alt="${esc(im.alt)}"${pos}${lazy ? ' loading="lazy"' : ""} decoding="async">`;
}
const metaLine = (p, media) => [media, p.year].filter(Boolean).join(", ");

const $ = (id) => document.getElementById(id);
const grid = $("grid"), filters = $("filters"), dlg = $("dlg"), dMain = $("d-main"), dThumbs = $("d-thumbs");
const PICKS = SELECTED.map((t) => {
  const i = LIST.findIndex((p) => p.title === t);
  if (i < 0) console.warn(`SELECTED: no project titled "${t}"`);
  return i;
}).filter((i) => i >= 0);
let active = PICKS.length ? "Selected" : "All";
let visible = LIST.map((_, i) => i);
let current = -1;

const MEDIA = [...new Set(LIST.flatMap((p) => p.media))];
const inFilter = (m) => m === "Selected" ? PICKS : LIST.map((_, i) => i).filter((i) => m === "All" || LIST[i].media.includes(m));
const countIn = (m) => inFilter(m).length;

function renderHeader() {
  $("copy").textContent = `© ${new Date().getFullYear()} ${SITE_NAME}`;
  document.title = `Things I’ve made · ${SITE_NAME}`;
}

function renderTiles() {
  grid.innerHTML = LIST.map((p, i) => {
    const cover = p.images[0];
    const more = p.images.length > 1 ? `<span class="more">${p.images.length} photos</span>` : "";
    return `<button class="tile" type="button" data-i="${i}">
      <span class="art">${cover ? imgTag(cover, { small: true }) : ""}</span>
      <span class="title">${esc(p.title)}${more}</span>
      <span class="sub">${esc(metaLine(p, p.technique || p.media[0]))}</span>
    </button>`;
  }).join("");
}

function renderFilters() {
  filters.innerHTML = [...(PICKS.length ? ["Selected"] : []), "All", ...MEDIA].map((m) =>
    `<button type="button" data-m="${esc(m)}" aria-pressed="${m === active}">${esc(m)}<span>${countIn(m)}</span></button>`).join("");
}

function applyFilter() {
  visible = inFilter(active);
  const tiles = [...grid.querySelectorAll(".tile")];
  const byIndex = new Map(tiles.map((t) => [+t.dataset.i, t]));
  const shown = new Set(visible);
  // Put tiles in display order so reading and tabbing follow what's on screen.
  [...visible, ...tiles.map((t) => +t.dataset.i).filter((i) => !shown.has(i))]
    .forEach((i) => { const t = byIndex.get(i); t.hidden = !shown.has(i); grid.appendChild(t); });
  filters.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === active)));
  $("count").textContent = active === "Selected"
    ? `${visible.length} selected of ${LIST.length} pieces`
    : `${visible.length} ${visible.length === 1 ? "piece" : "pieces"}` + (active === "All" ? "" : ` in ${active}`);
}

function showImage(p, k) {
  dMain.innerHTML = imgTag(p.images[k], { lazy: false });
  dThumbs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", String(j === k)));
}

function fillDialog(i) {
  const p = LIST[i];
  current = i;
  dThumbs.innerHTML = p.images.length > 1
    ? p.images.map((im, k) => `<button type="button" data-k="${k}" aria-label="Photo ${k + 1} of ${p.images.length}">${imgTag(im, { small: true, sizes: "56px" })}</button>`).join("")
    : "";
  if (p.images.length) showImage(p, 0); else dMain.innerHTML = "";
  const pos = visible.indexOf(i);
  $("d-count").textContent = pos >= 0 ? `${pos + 1} / ${visible.length}` : "";
  $("d-title").textContent = p.title;
  $("d-blurb").textContent = p.blurb || "";
  const rows = [["Medium", p.media.join(", ")], ["Technique", p.technique], ["Year", p.year], ["Materials", p.materials], ["Tools", p.tools]];
  $("d-dl").innerHTML = rows.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("d-notes").textContent = p.notes || "";
  $("d-notes").hidden = !p.notes;
  const egg = $("d-egg");
  egg.hidden = !p.egg;
  if (p.egg) { egg.firstChild.textContent = p.egg.text; egg.firstChild.setAttribute("href", p.egg.href); }
  const many = visible.length > 1;
  $("prev").hidden = $("next").hidden = !many;
}

/* Links: opening a piece sets #slug so it can be shared; the back button closes it. */
let pushedEntry = false, closingFromNav = false;

function openProject(i, { push = true } = {}) {
  fillDialog(i);
  const hash = `#${LIST[i].slug}`;
  if (push && location.hash !== hash) {
    if (dlg.open) history.replaceState(null, "", hash);
    else { history.pushState(null, "", hash); pushedEntry = true; }
  }
  if (!dlg.open) dlg.showModal();
}

function step(d) {
  if (!visible.length) return;
  const pos = visible.indexOf(current);
  const next = visible[(pos + d + visible.length) % visible.length];
  openProject(next);
}

function route() {
  const slug = decodeURIComponent(location.hash.slice(1));
  const i = LIST.findIndex((p) => p.slug === slug);
  if (i >= 0) openProject(i, { push: false });
  else if (dlg.open) { closingFromNav = true; dlg.close(); }
}

dlg.addEventListener("close", () => {
  current = -1;
  if (closingFromNav) { closingFromNav = false; pushedEntry = false; return; }
  if (pushedEntry) { pushedEntry = false; history.back(); }
  else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
});
window.addEventListener("hashchange", route);
dlg.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});
dThumbs.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && current >= 0) showImage(LIST[current], +b.dataset.k);
});
grid.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (t) openProject(+t.dataset.i);
});
filters.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { active = b.dataset.m; applyFilter(); }
});
$("close").addEventListener("click", () => dlg.close());
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

renderHeader();
renderTiles();
renderFilters();
applyFilter();
route();
}
</script>
</body>
</html>
